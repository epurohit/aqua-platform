[project]
name = "aqua-platform"
version = "0.1.0"
description = "AQUA Enterprise AI Agent Platform - Self-Pruning Neural Network with Reverse-Mode Autodiff Engine"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "scikit-learn>=1.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
